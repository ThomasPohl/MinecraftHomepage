<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Niklas' Befehlsbuch – Commands für Minecraft</title>
  <meta name="description" content="Alle Konsolen-Commands für Minecraft Java und Bedrock: sortierbare Übersicht, Erklärungen und ein Command-Builder zum Zusammenklicken.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/blockschrift.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Theme vor dem ersten Zeichnen setzen (kein Aufblitzen)
    (function () {
      var theme = null;
      try { theme = (JSON.parse(localStorage.getItem('befehlsbuch.v1') || '{}')).theme; } catch (e) {}
      if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <a class="skip" href="#app">Zum Inhalt</a>

  <header class="site-header">
    <div class="wrap head-row">
      <a class="brand" href="#/">
        <img src="img/poppy.svg" alt="" width="28" height="40">
        <span class="brand-text">Niklas' Befehlsbuch</span>
      </a>
      <div class="head-tools">
        <div class="seg" role="group" aria-label="Sprache / Language">
          <button type="button" class="btn small" data-lang="de">DE</button>
          <button type="button" class="btn small" data-lang="en">EN</button>
        </div>
        <button type="button" class="btn small" id="theme-toggle"></button>
      </div>
    </div>
    <p class="wrap tagline" id="tagline"></p>
    <div class="meadow" aria-hidden="true"></div>
    <div class="ground" aria-hidden="true"></div>
  </header>

  <main id="app" class="wrap" tabindex="-1">
    <noscript>Diese Seite braucht JavaScript. / This page needs JavaScript.</noscript>
  </main>

  <footer class="site-footer">
    <div class="meadow" aria-hidden="true"></div>
    <div class="ground" aria-hidden="true"></div>
    <div class="wrap foot-row">
      <nav>
        <a href="#/" id="foot-home"></a>
        <a href="#/impressum" id="foot-imprint"></a>
        <a href="#/datenschutz" id="foot-privacy"></a>
      </nav>
      <p class="disclaimer" id="disclaimer"></p>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
